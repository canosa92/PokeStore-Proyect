name: pokestore

services:

  # ──────────────────────────────────────────
  # MongoDB
  # ──────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: pokestore_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────
  # Backend — Producción
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./Back-PokeStore
    container_name: pokestore_backend
    restart: unless-stopped
    env_file:
      - ./Back-PokeStore/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/pokestore
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Frontend — Producción (Nginx sirve el build)
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./Front-PokeStore
      dockerfile: Dockerfile
      args:
        VITE_APP_API_URL: http://backend:3000
    container_name: pokestore_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data: